<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Together and Drop Outs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        .chart-container { width: 600px; height: 400px; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>Parents Together and Drop Outs</h1>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // Your data from Python
        const data = {
            'Total Drop Outs': [dropouts],
            'Total Parents Together': [total_parents_together],
            'Parents Together Drop Outs': [parents_together_dropouts_total],
            'Total Parents Apart': [total_parents_apart],
            'Parents Apart Drop Outs': [parents_apart_dropouts_total]
        };

        // Create a DataFrame-like structure
        const df = {
            'Total Drop Outs': data['Total Drop Outs'][100],
            'Total Parents Together': data['Total Parents Together'][80],
            'Parents Together Drop Outs': data['Parents Together Drop Outs'][12],
            'Total Parents Apart': data['Total Parents Apart'][569],
            'Parents Apart Drop Outs': data['Parents Apart Drop Outs'][88]
        };

        // Prepare data for Chart.js
        const labels = Object.keys(df);
        const values = Object.values(df);

        const ctx = document.getElementById('myChart').getContext('2d');

        const myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Drop Outs',
                    data: values,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Drop Outs'
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Parents Together and Drop Outs'
                    }
                }
            }
        });
    </script>
</body>
</html>
